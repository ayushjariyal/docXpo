[alembic]
script_location = alembic

# Lets `alembic` find the `app` package when run from the project root.
prepend_sys_path = .

# Timestamped revision filenames sort chronologically in the directory listing,
# which makes the migration history readable at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# NOTE: sqlalchemy.url is intentionally absent. It is injected in env.py from
# Settings, so the database password never lives in a committed file and there
# is exactly one source of truth for connection details.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
