[project]
name = "docxpo"
version = "0.1.0"
description = "Self-hostable LLM gateway and RAG service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # [asyncio] pulls in greenlet, which SQLAlchemy needs to run its
    # (internally synchronous) ORM machinery under an async driver.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    # LLM provider clients. Official SDKs for the two hosted providers; Ollama
    # has no official Python SDK, so it is driven over httpx (which the SDKs
    # depend on anyway, so it is not an extra dependency in practice).
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "pgvector>=0.3.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    # Pure Python: no poppler/system binaries to install in the image.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# asyncio_mode=auto means we don't need @pytest.mark.asyncio on every test.
asyncio_mode = "auto"
# Session-scoped event loop so module/session-scoped async fixtures
# (a DB engine, a Redis pool) can be shared across tests.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: runs against real Postgres/Redis; skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
